system:
  root_directory: .
  log_directory: ./logs
mindstorm:
  ev3:
    listen_address: ":9000"
  motors:
    left:
      address: motor0
      inverted: false
      speed: 0.4
    right:
      address: motor2
      inverted: true
      speed: 0.4
    head:
      address: motor2
      inverted: true
      speed: 0.5
    back:
      address: motor1
      inverted: false
      speed: 0.5
    latch_open_time: 8s
    motor_test_time: 30s
