system:
  root_directory: .
  log_directory: ./logs
mindstorm:
  motors:
    left:
      address: motor0
      inverted: false
      speed: 0.4
    right:
      address: motor2
      inverted: true
      speed: 0.4
    head:
      address: motor2
      inverted: true
      speed: 0.5
    back:
      address: motor1
      inverted: false
      speed: 0.5
    motor_test_time: 30s
navigation:
  camera_device: 0
  camera_width: 640
  camera_height: 480
  drive_speed: 0.35
  turn_speed: 0.25
  steering_gain: 0.6
  collect_distance_threshold: 1.5
  collect_dwell_ms: 1200
  search_timeout_ms: 2000
  tick_interval_ms: 50
  debug_vision: false
  # HSV colour range for ball detection (ping-pong balls are white/light-yellow)
  # H: 0-179, S: 0-255, V: 0-255
  hsv_lower: [0, 0, 180]
  hsv_upper: [179, 60, 255]
  # Hough circle parameters
  hough_dp: 1.2
  hough_min_dist: 30
  hough_param1: 100
  hough_param2: 20
  hough_min_radius: 8
  hough_max_radius: 80
