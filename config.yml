system:
  root_directory: .
  log_directory: ./logs
mindstorm:
  motors:
    left:
      address: motor0
      inverted: false
      speed: 0.4
    right:
      address: motor2
      inverted: true
      speed: 0.4
    head:
      address: motor2
      inverted: true
      speed: 0.5
    back:
      address: motor1
      inverted: false
      speed: 0.5
    motor_test_time: 30s
vision:
  camera_device: 0
  camera_width: 640
  camera_height: 480
  camera_fps: 30

  stream_bind: 0.0.0.0
  stream_port: 8080

  # Robot marker colours for top-down pose detection.
  # Suggested setup:
  #   - blue sticker on robot body center
  #   - red sticker on robot front
  robot_body_lower:
    h: 90
    s: 80
    v: 80
  robot_body_upper:
    h: 130
    s: 255
    v: 255

  robot_front_lower:
    h: 0
    s: 120
    v: 120
  robot_front_upper:
    h: 10
    s: 255
    v: 255

  # Perspective warp — corrects keystoning when the overhead camera is not
  # perfectly orthographic.
  #
  # How to calibrate:
  #   1. Capture a single frame from the camera (e.g. with `fswebcam` or the
  #      debug_vision mode) and open it in an image viewer that shows pixel
  #      coordinates (GIMP, Fiji, etc.).
  #   2. Place a physical marker (tape, coloured sticker) at each of the four
  #      corners of the play field and read off their pixel coordinates.
  #   3. Fill in the values below in the order: top_left, top_right,
  #      bottom_right, bottom_left — as seen in the raw camera frame.
  #   4. Set enabled: true.
  #
  # output_width / output_height should match camera_width / camera_height so
  # that the rest of the pipeline (NormX / NormY) does not change scale.
  perspective:
    enabled: false
    top_left:     { x: 0,   y: 0   }
    top_right:    { x: 640, y: 0   }
    bottom_right: { x: 640, y: 480 }
    bottom_left:  { x: 0,   y: 480 }
    output_width:  640
    output_height: 480

  # HSV colour range for ball detection (ping-pong balls are white/light-yellow)
  # H: 0-179, S: 0-255, V: 0-255
  hsv_lower:
    h: 0
    s: 0
    v: 180
  hsv_upper:
    h: 179
    s: 60
    v: 255
  # Hough circle detection parameters
  hough_dp: 1.2
  hough_min_dist: 30
  hough_param1: 100
  hough_param2: 20
  hough_min_radius: 8
  hough_max_radius: 80
  blur_kernel: 9
  # distance = distance_k / apparent_radius — tune on the real robot
  distance_k: 200
  debug_vision: false
navigation:
  drive_speed: 0.35
  turn_speed: 0.25
  steering_gain: 0.6
  collect_distance_threshold: 1.5
  collect_dwell_ms: 1200
  search_timeout_ms: 2000
  tick_interval_ms: 50
